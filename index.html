<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>無障礙美食地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* =========================================
     iOS 27 Design System (Liquid Glass & HIG)
     ========================================= */
  :root {
    --system-background: #F2F2F7;
    --secondary-system-grouped-background: #FFFFFF;
    --tertiary-system-grouped-background: #F2F2F7;
    --label: #000000;
    --secondary-label: rgba(60, 60, 67, 0.6);
    --separator: rgba(60, 60, 67, 0.29);
    --system-blue: #007AFF;
    --system-green: #34C759;
    --system-pink: #FF2D55;
    --system-orange: #FF9500;
    
    --glass-bg: rgba(255, 255, 255, 0.65);
    --glass-border: rgba(255, 255, 255, 0.5);
    --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --glass-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.8);

    --text-large-title: 34px;
    --text-title1: 28px;
    --text-title2: 22px;
    --text-headline: 17px;
    --text-body: 17px;
    --text-subheadline: 15px;
    --text-footnote: 13px;

    --spring: cubic-bezier(0.16, 1, 0.3, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --system-background: #000000;
      --secondary-system-grouped-background: #1C1C1E;
      --tertiary-system-grouped-background: #2C2C2E;
      --label: #FFFFFF;
      --secondary-label: rgba(235, 235, 245, 0.6);
      --separator: rgba(84, 84, 88, 0.6);
      
      --glass-bg: rgba(30, 30, 30, 0.6);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  /* 徹底鎖死畫面，防止向右偏移 */
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    background-color: var(--system-background);
    color: var(--label);
    width: 100vw;
    height: 100vh;
    position: fixed; /* 關鍵：鎖定視口 */
    top: 0;
    left: 0;
    overflow: hidden;
    overscroll-behavior: none; /* 防止邊緣回彈 */
    user-select: none;
    -webkit-user-select: none;
  }

  /* =========================================
     Liquid Glass Components
     ========================================= */
  .glass-regular {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border: 0.5px solid var(--glass-border);
    box-shadow: var(--glass-shadow), var(--glass-highlight);
    border-radius: 999px;
    transition: transform 0.2s var(--spring);
    touch-action: manipulation;
  }

  .glass-regular:active {
    transform: scale(0.96);
  }

  .glass-prominent {
    background: var(--system-blue);
    color: #FFFFFF;
    backdrop-filter: blur(24px) saturate(200%);
    border: 0.5px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    border-radius: 14px;
    transition: transform 0.2s var(--spring);
    touch-action: manipulation;
  }
  
  .glass-prominent:active {
    transform: scale(0.96);
  }

  /* =========================================
     Layout & Views
     ========================================= */
  .view-container {
    position: absolute;
    inset: 0;
    padding-bottom: 100px;
    overflow-y: auto;
    overflow-x: hidden; /* 防止水平滾動 */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--spring), transform 0.3s var(--spring);
    transform: translateY(10px);
    z-index: 1;
  }

  .view-container.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
    z-index: 2;
  }

  /* =========================================
     Map Specifics
     ========================================= */
  #map {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .map-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px;
  }

  .map-overlay > * {
    pointer-events: auto;
  }

  .nav-bar-title {
    font-size: var(--text-title2);
    font-weight: 700;
    text-align: center;
    padding: 12px 24px;
    margin-top: 20px;
    width: fit-content;
    align-self: center;
  }

  /* 修復：Bottom Sheet */
  .bottom-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    background: var(--secondary-system-grouped-background);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
    transform: translateY(calc(100% - 100px));
    transition: transform 0.4s var(--spring);
    z-index: 10;
    display: flex;
    flex-direction: column;
    max-height: 80vh;
    padding-bottom: 80px;
  }

  .bottom-sheet.expanded {
    transform: translateY(0);
  }

  .sheet-grabber-container {
    padding: 12px 0 16px 0;
    display: flex;
    justify-content: center;
    cursor: grab;
    touch-action: none; /* 防止拖拽時偏移 */
  }

  .sheet-grabber {
    width: 36px;
    height: 5px;
    background: var(--separator);
    border-radius: 2.5px;
  }

  .sheet-content {
    padding: 0 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* =========================================
     iOS Lists
     ========================================= */
  .list-header {
    font-size: var(--text-footnote);
    color: var(--secondary-label);
    text-transform: uppercase;
    padding: 16px 16px 8px 16px;
    font-weight: 500;
  }

  .inset-grouped-list {
    background: var(--secondary-system-grouped-background);
    border-radius: 12px;
    overflow: hidden;
    margin: 0 16px;
  }

  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    padding: 12px 16px;
    background: var(--secondary-system-grouped-background);
    border-bottom: 0.5px solid var(--separator);
    margin-left: 16px;
    padding-left: 0;
    cursor: pointer;
    transition: background 0.1s;
  }

  .list-row:active {
    background: var(--tertiary-system-grouped-background);
  }

  .list-row:last-child {
    border-bottom: none;
  }

  .row-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .row-title {
    font-size: var(--text-body);
    color: var(--label);
  }

  .row-subtitle {
    font-size: var(--text-footnote);
    color: var(--secondary-label);
  }

  .row-value {
    font-size: var(--text-body);
    color: var(--secondary-label);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chevron {
    color: var(--secondary-label);
    font-size: var(--text-body);
    font-weight: 600;
  }

  /* =========================================
     Forms
     ========================================= */
  .form-section {
    margin-bottom: 24px;
  }

  .input-field {
    width: 100%;
    padding: 12px 16px;
    font-size: var(--text-body);
    background: var(--secondary-system-grouped-background);
    border: none;
    color: var(--label);
    outline: none;
  }

  .input-field::placeholder {
    color: var(--secondary-label);
  }

  .chips-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
    background: var(--secondary-system-grouped-background);
    border-radius: 12px;
    margin: 0 16px;
  }

  .chip {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: var(--text-subheadline);
    background: var(--tertiary-system-grouped-background);
    color: var(--label);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    touch-action: manipulation;
  }

  .chip.on {
    background: var(--system-blue);
    color: #FFF;
  }

  /* =========================================
     Floating Tab Bar (Fixed & Centered)
     ========================================= */
  .tab-bar {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    margin: 0 auto; /* 完美置中，唔用 transform */
    width: max-content; /* 根據內容自適應寬度 */
    display: flex;
    gap: 4px;
    padding: 6px 12px;
    z-index: 1000;
    border-radius: 999px;
    touch-action: none;
  }

  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    min-width: 72px;
    border-radius: 999px;
    cursor: pointer;
    color: var(--secondary-label);
    transition: color 0.2s;
    touch-action: manipulation;
  }

  .tab-item.active {
    color: var(--system-blue);
  }

  .tab-icon {
    font-size: 24px;
    margin-bottom: 2px;
  }

  .tab-label {
    font-size: 10px;
    font-weight: 500;
  }

  /* =========================================
     Modals / Sheets
     ========================================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet-modal {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    background: var(--system-background);
    border-radius: 24px 24px 0 0;
    z-index: 2001;
    transform: translateY(100%);
    transition: transform 0.4s var(--spring);
    display: flex;
    flex-direction: column;
    max-height: 90vh;
  }

  .sheet-modal.active {
    transform: translateY(0);
  }

  .sheet-modal .sheet-content {
    padding: 0 16px 32px 16px;
    overflow-y: auto;
  }

  /* 修復：改用 flex-wrap 避免橫向滾動 */
  .emoji-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 8px;
    padding-bottom: 8px;
  }

  .emoji-btn {
    font-size: 32px;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: var(--secondary-system-grouped-background);
    cursor: pointer;
    transition: transform 0.2s var(--spring), border-color 0.2s;
    touch-action: manipulation;
  }

  .emoji-btn.on {
    border-color: var(--system-blue);
    transform: scale(1.1);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 16px;
    font-size: var(--text-headline);
    font-weight: 600;
    border: none;
    cursor: pointer;
    margin-top: 16px;
    touch-action: manipulation;
  }

  .fireworks-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  
  .firework-particle {
    position: absolute;
    font-size: 32px;
    animation: fly 1.4s var(--spring) forwards;
  }

  @keyframes fly {
    0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

  <!-- MAP TAB -->
  <div id="view-map" class="view-container active" style="padding-bottom: 0;">
    <div id="map"></div>
    
    <div class="map-overlay">
      <div class="nav-bar-title glass-regular">
        全港無障礙美食
      </div>
    </div>

    <div class="bottom-sheet" id="rankSheet">
      <div class="sheet-grabber-container" id="sheetGrabber">
        <div class="sheet-grabber"></div>
      </div>
      <div class="sheet-content">
        <h2 style="font-size: var(--text-title2); margin: 0 0 16px 0; padding-left: 16px;">無障礙推薦榜</h2>
        <div class="inset-grouped-list" id="rankList"></div>
      </div>
    </div>
  </div>

  <!-- RECRUIT TAB -->
  <div id="view-recruit" class="view-container">
    <h1 class="list-header" style="font-size: var(--text-large-title); text-transform: none; color: var(--label); font-weight: 700; padding: 24px 16px 8px 16px;">聽障招聘</h1>
    <p style="padding: 0 16px 16px; color: var(--secondary-label); font-size: var(--text-subheadline); margin: 0;">系統自動配對無障礙工作崗位。</p>

    <div class="form-section">
      <div class="list-header">基本資料</div>
      <div class="inset-grouped-list">
        <div class="list-row" style="margin: 0; padding: 0 16px;">
          <input type="text" class="input-field" id="seekerName" placeholder="輸入姓名" value="陳小姐">
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="list-header">擅長嘅工作特質</div>
      <div class="chips-container" id="traitChips"></div>
    </div>

    <div class="form-section">
      <div class="list-header">偏好崗位類型</div>
      <div class="chips-container" id="typeChips"></div>
    </div>

    <div style="padding: 0 16px;">
      <button class="btn glass-prominent" onclick="runMatching()">開始配對</button>
    </div>

    <div id="matchResults" style="padding: 16px;"></div>
  </div>

  <!-- TIP TAB -->
  <div id="view-tip" class="view-container">
    <h1 class="list-header" style="font-size: var(--text-large-title); text-transform: none; color: var(--label); font-weight: 700; padding: 24px 16px 8px 16px;">打賞員工</h1>
    
    <div class="inset-grouped-list" style="margin-bottom: 24px;">
      <div class="list-row" style="cursor: default;">
        <div class="row-content">
          <span class="row-title" id="staffName">阿明</span>
          <span class="row-subtitle" id="staffMeta">聰鳴茶座 · 水吧</span>
        </div>
        <div class="row-value" style="color: var(--system-green); font-weight: 600;" id="staffTotal">HK$320</div>
      </div>
    </div>

    <div class="list-header">選擇虛擬禮物</div>
    <div class="inset-grouped-list" id="giftList"></div>

    <div style="padding: 16px;">
      <div style="display: flex; justify-content: space-between; font-size: var(--text-footnote); color: var(--secondary-label); margin-bottom: 16px;">
        <span>平台手續費 (5%)</span>
        <span id="feeText">HK$0.00</span>
      </div>
      <button class="btn glass-prominent" style="background: var(--system-pink); box-shadow: 0 4px 16px rgba(255, 45, 85, 0.3);" onclick="sendTip()">送出打賞 🎆</button>
    </div>
    
    <div class="fireworks-container" id="fx"></div>
  </div>

  <!-- B2B TAB -->
  <div id="view-b2b" class="view-container">
    <h1 class="list-header" style="font-size: var(--text-large-title); text-transform: none; color: var(--label); font-weight: 700; padding: 24px 16px 8px 16px;">餐廳後台</h1>
    
    <div class="inset-grouped-list" style="margin-bottom: 24px;">
      <div class="list-row" style="cursor: default;">
        <div class="row-content">
          <span class="row-title">廣告與招聘錢包</span>
          <span class="row-subtitle">可用餘額</span>
        </div>
        <div class="row-value" id="walletBal" style="font-size: 20px; font-weight: 600; color: var(--label);">HK$10,000</div>
      </div>
    </div>

    <div class="list-header">推廣費 (Promotion Fee)</div>
    <div class="inset-grouped-list" style="margin-bottom: 24px;">
      <div class="list-row" onclick="buyAd(500)">
        <span class="row-title" style="color: var(--system-blue);">買推薦榜 Top 1 一週</span>
        <span class="row-value">HK$500</span>
      </div>
      <div class="list-row" onclick="buyAd(100)">
        <span class="row-title" style="color: var(--system-blue);">派 $10 優惠券 x10</span>
        <span class="row-value">HK$100</span>
      </div>
    </div>

    <div class="list-header">招聘配對 (Recruitment Fee)</div>
    <div class="inset-grouped-list" id="b2bTalents"></div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar glass-regular">
    <div class="tab-item active" data-target="view-map" onclick="switchTab(this)">
      <span class="tab-icon">🗺️</span>
      <span class="tab-label">地圖</span>
    </div>
    <div class="tab-item" data-target="view-recruit" onclick="switchTab(this)">
      <span class="tab-icon">🤝</span>
      <span class="tab-label">招聘</span>
    </div>
    <div class="tab-item" data-target="view-tip" onclick="switchTab(this)">
      <span class="tab-icon">🎆</span>
      <span class="tab-label">打賞</span>
    </div>
    <div class="tab-item" data-target="view-b2b" onclick="switchTab(this)">
      <span class="tab-icon">💼</span>
      <span class="tab-label">後台</span>
    </div>
  </nav>

  <!-- Rating Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeRating()"></div>
  <div class="sheet-modal" id="ratingModal">
    <div class="sheet-grabber-container" onclick="closeRating()">
      <div class="sheet-grabber"></div>
    </div>
    <div class="sheet-content">
      <h2 id="rpName" style="font-size: var(--text-title1); margin: 0 0 4px 0;">餐廳名稱</h2>
      <div id="rpMeta" style="font-size: var(--text-subheadline); color: var(--secondary-label); margin-bottom: 24px;"></div>
      
      <div id="ratingForm"></div>
      
      <button class="btn glass-prominent" style="margin-top: 32px;" onclick="submitRating()">提交評分</button>
    </div>
  </div>

<script>
/* 攔截所有拖拽及選取事件，徹底防止網頁平移 */
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

/* ================= Data Layer ================= */
const restaurants = [
  { id:"r1", name:"聰鳴茶座", district:"將軍澳", lat:22.3075, lng:114.2602, score:92, promotion:true, rating:{staffFriendliness:5, lighting:4, noise:4, communication:["文字","手語","QR落單"]}, tags:["社企","手語支援"] },
  { id:"r2", name:"樂農", district:"灣仔", lat:22.2775, lng:114.1733, score:90, promotion:false, rating:{staffFriendliness:5, lighting:5, noise:4, communication:["文字","圖示餐牌"]}, tags:["社企","圖示餐牌"] },
  { id:"r3", name:"太興", district:"旺角", lat:22.3193, lng:114.1694, score:78, promotion:false, rating:{staffFriendliness:4, lighting:4, noise:2, communication:["QR落單","文字"]}, tags:["連鎖","聽障員工"] },
  { id:"r5", name:"靜·咖啡", district:"中環", lat:22.2819, lng:114.1582, score:86, promotion:true, rating:{staffFriendliness:4, lighting:4, noise:5, communication:["手語","文字"]}, tags:["安靜","手語支援"] },
];

const jobs = [
  { id:"j1", restaurantName:"聰鳴茶座", title:"水吧助理", type:"水吧", traits:["重複性工作","專注","視覺指示"] },
  { id:"j2", restaurantName:"太興", title:"備餐員", type:"備餐", traits:["重複性工作","專注","圖示SOP"] },
  { id:"j3", restaurantName:"靜·咖啡", title:"咖啡師學徒", type:"水吧", traits:["專注","視覺指示","手語溝通"] },
];

const GIFTS = [{e:"☕",l:"請飲咖啡",a:20},{e:"🍰",l:"請食蛋糕",a:50},{e:"🌟",l:"超級星星",a:100}];
let selectedGift = GIFTS[0];

/* ================= Navigation & Layout ================= */
let map, mapInited = false;

function switchTab(el) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  
  const targetId = el.getAttribute('data-target');
  document.querySelectorAll('.view-container').forEach(v => {
    v.classList.remove('active');
  });
  document.getElementById(targetId).classList.add('active');

  if(targetId === 'view-map') {
    if(!mapInited) initMap();
    setTimeout(() => { if(map) map.invalidateSize(); }, 300);
  }
}

/* ================= Map & Sheet ================= */
function initMap(){
  mapInited = true;
  map = L.map('map', { zoomControl: false }).setView([22.31,114.17], 12);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { 
    subdomains: ['1','2','3','4'], attribution: '&copy; 高德地圖', maxZoom: 18 
  }).addTo(map);
  
  const icon = L.divIcon({ 
    html:'<div style="background:var(--system-blue);width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>', 
    className:"", iconSize:[20,20] 
  });

  restaurants.forEach(r=>{
    L.marker([r.lat,r.lng],{icon}).addTo(map).on('click', () => {
      document.getElementById('rankSheet').classList.add('expanded');
      openRating(r.id);
    });
  });
  
  renderRank();
}

const sheetGrabber = document.getElementById('sheetGrabber');
let isDragging = false, startY = 0, startTransform = 0;

sheetGrabber.addEventListener('pointerdown', (e) => {
  isDragging = true;
  startY = e.clientY;
  const sheet = document.getElementById('rankSheet');
  const style = window.getComputedStyle(sheet);
  const matrix = new DOMMatrixReadOnly(style.transform);
  startTransform = matrix.m42 || 0;
  sheet.style.transition = 'none';
  e.preventDefault(); 
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const deltaY = e.clientY - startY;
  let newY = startTransform + deltaY;
  if (newY < 0) newY = 0;
  document.getElementById('rankSheet').style.transform = `translateY(${newY}px)`;
});

window.addEventListener('pointerup', (e) => {
  if (!isDragging) return;
  isDragging = false;
  const sheet = document.getElementById('rankSheet');
  sheet.style.transition = 'transform 0.4s var(--spring)';
  sheet.style.transform = '';
  
  const deltaY = e.clientY - startY;
  if (deltaY < -50) {
    sheet.classList.add('expanded');
  } else if (deltaY > 50) {
    sheet.classList.remove('expanded');
  }
});

function renderRank(){
  const html = [...restaurants].sort((a,b)=>b.score-a.score).map((r,i)=>`
    <div class="list-row" onclick="openRating('${r.id}')">
      <div class="row-content">
        <span class="row-title">${i+1}. ${r.name} ${r.promotion?'<span style="font-size:10px;color:var(--system-orange);">★</span>':''}</span>
        <span class="row-subtitle">${r.district}</span>
      </div>
      <div class="row-value">
        <span style="color:var(--system-blue);font-weight:600;">${r.score}</span>
        <span class="chevron">›</span>
      </div>
    </div>
  `).join('');
  document.getElementById('rankList').innerHTML = html;
}

/* ================= Rating Modal ================= */
const DIMS = [
  { key:"staffFriendliness", label:"店員態度友善度", emojis:["😐","🙂","😊","🤝","🌟"] },
  { key:"lighting", label:"光線夠唔夠睇口型", emojis:["🌑","🌒","🌓","🌔","💡"] },
  { key:"noise", label:"環境安靜程度", emojis:["📢","🔉","🔈","🔇","🤫"] },
];
let currentValues = {};

function openRating(id) {
  const r = restaurants.find(x => x.id === id);
  document.getElementById('rpName').innerText = r.name;
  document.getElementById('rpMeta').innerText = r.district;
  currentValues = {};
  
  const formHtml = DIMS.map(d => `
    <div style="margin-bottom: 24px;">
      <div class="list-header" style="padding: 0 0 8px 0;">${d.label}</div>
      <div class="emoji-row">
        ${d.emojis.map((e, i) => `
          <button class="emoji-btn" data-key="${d.key}" data-val="${i+1}" onclick="selectEmoji(this)">${e}</button>
        `).join('')}
      </div>
    </div>
  `).join('');
  
  document.getElementById('ratingForm').innerHTML = formHtml;
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('ratingModal').classList.add('active');
}

function closeRating() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('ratingModal').classList.remove('active');
}

function selectEmoji(btn) {
  const key = btn.getAttribute('data-key');
  currentValues[key] = +btn.getAttribute('data-val');
  
  document.querySelectorAll(`.emoji-btn[data-key="${key}"]`).forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function submitRating() {
  closeRating();
}

/* ================= Recruit ================= */
const TRAITS = ["專注","重複性工作","視覺指示","手語溝通","團隊協作"];
const TYPES = ["水吧","備餐","後勤","樓面支援"];
let seeker = { traits:["專注","重複性工作"], preferredType:["水吧"] };

function renderChips() {
  document.getElementById("traitChips").innerHTML = TRAITS.map(t =>
    `<div class="chip ${seeker.traits.includes(t)?'on':''}" onclick="toggleSeeker('traits','${t}')">${t}</div>`
  ).join("");
  document.getElementById("typeChips").innerHTML = TYPES.map(t =>
    `<div class="chip ${seeker.preferredType.includes(t)?'on':''}" onclick="toggleSeeker('preferredType','${t}')">${t}</div>`
  ).join("");
}

window.toggleSeeker = (field, val) => {
  seeker[field] = seeker[field].includes(val) ? seeker[field].filter(x => x !== val) : [...seeker[field], val];
  renderChips();
};

window.runMatching = () => {
  const res = jobs.map(job => {
    const hits = job.traits.filter(t => seeker.traits.includes(t)).length;
    const typeHit = seeker.preferredType.includes(job.type) ? 1 : 0;
    return { job, score: hits * 20 + typeHit * 40, hits };
  }).sort((a,b) => b.score - a.score);

  document.getElementById("matchResults").innerHTML = `
    <div class="list-header" style="padding-left:0;">配對結果</div>
    <div class="inset-grouped-list" style="margin:0;">
      ${res.map(r => `
        <div class="list-row">
          <div class="row-content">
            <span class="row-title">${r.job.title}</span>
            <span class="row-subtitle">${r.job.restaurantName} · ${r.job.type}</span>
          </div>
          <div class="row-value" style="color:var(--system-green);font-weight:600;">${r.score}%</div>
        </div>
      `).join('')}
    </div>
  `;
};

/* ================= Tip & Fireworks ================= */
function renderTip() {
  document.getElementById("giftList").innerHTML = GIFTS.map(g => `
    <div class="list-row" onclick="selectGift('${g.l}')">
      <div class="row-content" style="flex-direction:row;align-items:center;gap:12px;">
        <span style="font-size:24px;">${g.e}</span>
        <span class="row-title">${g.l}</span>
      </div>
      <div class="row-value">
        <span style="font-weight:600;color:var(--label);">HK$${g.a}</span>
        ${selectedGift.l === g.l ? '<span style="color:var(--system-blue);">✓</span>' : ''}
      </div>
    </div>
  `).join("");
  document.getElementById("feeText").innerText = `HK$${(selectedGift.a * 0.05).toFixed(2)}`;
}

window.selectGift = (l) => {
  selectedGift = GIFTS.find(g => g.l === l);
  renderTip();
};

window.sendTip = () => {
  const fx = document.getElementById("fx");
  for(let i=0; i<15; i++) {
    const sp = document.createElement("div");
    sp.className = "firework-particle";
    sp.innerText = ["🎆","✨","🌟","👏","🤟","💖"][Math.floor(Math.random()*6)];
    sp.style.left = '50%';
    sp.style.top = '50%';
    sp.style.setProperty("--x", (Math.random()*300-150)+"px");
    sp.style.setProperty("--y", (Math.random()*-300-50)+"px");
    fx.appendChild(sp);
  }
  setTimeout(() => fx.innerHTML = "", 1500);
  
  const totalEl = document.getElementById('staffTotal');
  let current = parseInt(totalEl.innerText.replace('HK$', ''));
  totalEl.innerText = `HK$${current + selectedGift.a}`;
};

window.buyAd = (cost) => {
  if(wallet < cost) return alert("餘額不足！");
  wallet -= cost;
  document.getElementById("walletBal").innerText = `HK$${wallet}`;
  alert(`已扣除 HK$${cost}！`);
};

window.hireTalent = (name) => {
  if(wallet < 3000) return alert("餘額不足！");
  wallet -= 3000;
  document.getElementById("walletBal").innerText = `HK$${wallet}`;
  alert(`已扣除 HK$3,000，向 ${name} 發出面試邀請！`);
};
